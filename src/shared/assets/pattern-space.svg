<svg xmlns="http://www.w3.org/2000/svg" width="280" height="280" viewBox="0 0 280 280" fill="none">
  <!--
    Паттерн обоев чата MAX: космические дудлы, тайл 280×280.
    Используется как mask-image поверх градиента (см. Wallpaper.module.css),
    поэтому важна только альфа-составляющая фигур.
  -->
  <defs>
    <g id="planet-ring">
      <circle r="9" fill="#000"/>
      <ellipse rx="17" ry="6" stroke="#000" stroke-width="2" fill="none" transform="rotate(-18)"/>
    </g>
    <g id="planet-craters">
      <circle r="10" fill="#000"/>
      <circle cx="-3" cy="-3" r="1.6" fill="#fff"/>
      <circle cx="3" cy="2" r="1.1" fill="#fff"/>
      <circle cx="1" cy="-5" r="0.9" fill="#fff"/>
    </g>
    <g id="moon">
      <path fill="#000" fill-rule="evenodd" d="M0-12a12 12 0 1 0 0 24 12 12 0 1 0 0-24Zm5-1a9 9 0 1 1 0 20 9 9 0 1 1 0-20Z"/>
    </g>
    <g id="rocket">
      <path fill="#000" d="M0-17c4 4 6 10 6 17 0 4-1 8-2 11h-8c-1-3-2-7-2-11 0-7 2-13 6-17Z"/>
      <path fill="#000" d="M-6 4-13 16l7-3Z"/>
      <path fill="#000" d="M6 4l7 12-7-3Z"/>
      <circle cy="-4" r="2.6" fill="#fff"/>
      <path fill="#000" d="M-3 13h6l-1 5h-4Z"/>
    </g>
    <g id="satellite">
      <rect x="-7" y="-6" width="14" height="12" rx="2" fill="#000"/>
      <rect x="-24" y="-5" width="13" height="10" rx="1.5" fill="#000"/>
      <rect x="11" y="-5" width="13" height="10" rx="1.5" fill="#000"/>
      <path stroke="#000" stroke-width="1" d="M-21-5v10M-17-5v10M14-5v10M18-5v10"/>
      <path stroke="#000" stroke-width="1.4" d="M0-6v-6"/>
    </g>
    <g id="astronaut">
      <circle r="11" stroke="#000" stroke-width="2" fill="none"/>
      <circle cy="1" r="6" fill="#000"/>
      <path fill="#000" d="M-2-13h4v4h-4Z"/>
      <path stroke="#000" stroke-width="1.4" d="M-8-8 8 10M8-8-8 10" opacity="0.75"/>
    </g>
    <g id="ufo">
      <ellipse rx="14" ry="5" stroke="#000" stroke-width="2" fill="none"/>
      <path fill="#000" d="M-6 1a6 6 0 0 1 12 0Z"/>
      <circle cx="-9" cy="2" r="1.2" fill="#000"/>
      <circle cx="9" cy="2" r="1.2" fill="#000"/>
    </g>
    <g id="telescope">
      <path stroke="#000" stroke-width="2" d="M-13 9 3-3M-2 12 12 2"/>
      <path fill="#000" d="M4-13l9 5-5 9-9-5Z"/>
    </g>
    <g id="comet">
      <circle r="6" fill="#000"/>
      <path stroke="#000" stroke-width="1.6" d="M-6-6l-10-9M-7 0l-13 0M-6 6l-9 9"/>
    </g>
    <g id="orbit">
      <ellipse rx="22" ry="9" stroke="#000" stroke-width="1.6" fill="none" transform="rotate(24)"/>
      <circle cx="18" cy="-12" r="4" fill="#000"/>
    </g>
    <g id="sparkle">
      <path fill="#000" d="M12 0c1.1 6.4 4.6 9.9 11 11-6.4 1.1-9.9 4.6-11 11-1.1-6.4-4.6-9.9-11-11 6.4-1.1 9.9-4.6 11-11Z"/>
    </g>
    <g id="star">
      <path fill="#000" d="M9 0l2.6 6.4L18 9l-6.4 2.6L9 18l-2.6-6.4L0 9l6.4-2.6Z"/>
    </g>
    <g id="dots">
      <circle r="1.6" fill="#000"/>
      <path stroke="#000" stroke-width="1.2" d="M13-8 30 4M-13-8-30 4"/>
      <circle cx="13" cy="-8" r="2" fill="#000"/>
      <circle cx="30" cy="4" r="1.4" fill="#000"/>
      <circle cx="-13" cy="-8" r="1.6" fill="#000"/>
      <circle cx="-30" cy="4" r="2.2" fill="#000"/>
    </g>
    <g id="flag">
      <path stroke="#000" stroke-width="1.6" d="M-6 12V-12"/>
      <path fill="#000" d="M-4-12h13l-4 5 4 5H-4Z"/>
    </g>
  </defs>

  <use href="#planet-ring" transform="translate(38 34) rotate(-8) scale(1.15)"/>
  <use href="#sparkle" transform="translate(126 8) scale(0.75)"/>
  <use href="#astronaut" transform="translate(196 44) rotate(6)"/>
  <use href="#dots" transform="translate(258 16) scale(0.9)"/>
  <use href="#star" transform="translate(94 62) scale(0.8)"/>
  <use href="#moon" transform="translate(20 86) scale(0.85)"/>
  <use href="#orbit" transform="translate(150 106) scale(1.05)"/>
  <use href="#rocket" transform="translate(238 96) rotate(18) scale(0.95)"/>
  <use href="#planet-craters" transform="translate(66 132) scale(1.1)"/>
  <use href="#sparkle" transform="translate(196 150) scale(0.6)"/>
  <use href="#satellite" transform="translate(266 168) rotate(-12) scale(0.9)"/>
  <use href="#comet" transform="translate(28 186) rotate(-24) scale(0.9)"/>
  <use href="#astronaut" transform="translate(118 190) rotate(-8) scale(0.85)"/>
  <use href="#star" transform="translate(176 214) scale(0.65)"/>
  <use href="#ufo" transform="translate(70 236) scale(1.05)"/>
  <use href="#telescope" transform="translate(214 252) rotate(10) scale(0.95)"/>
  <use href="#flag" transform="translate(258 224) scale(0.85)"/>
  <use href="#dots" transform="translate(16 268) rotate(160) scale(0.8)"/>
  <use href="#moon" transform="translate(150 268) scale(0.7)"/>
</svg>
